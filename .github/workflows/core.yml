name: core

on:
  push:
    branches: ["**"]
    paths: ["core/**", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**", ".github/workflows/core.yml"]
  workflow_dispatch:

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: core

jobs:
  check:
    name: тесты, clippy, формат
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Установить toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Формат
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Тесты
        run: cargo test --all-features

      - name: Документация без предупреждений
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  cross:
    name: сборка под ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-linux-android }
          - { os: ubuntu-latest, target: armv7-linux-androideabi }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          # Целевые платформы клиента: сборка ядра под устройство и симулятор.
          - { os: macos-latest, target: aarch64-apple-ios }
          - { os: macos-latest, target: aarch64-apple-ios-sim }
    steps:
      - uses: actions/checkout@v5

      - name: Установить toolchain с целевой платформой
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: ${{ matrix.target }}

      - name: Сборка
        run: cargo build --release --target ${{ matrix.target }}

  audit:
    name: аудит зависимостей
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: core
