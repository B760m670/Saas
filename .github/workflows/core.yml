name: core

on:
  push:
    branches: ["**"]
    paths: ["core/**", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**", ".github/workflows/core.yml"]
  workflow_dispatch:

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: core

jobs:
  check:
    name: тесты, clippy, формат
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Установить toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Формат
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Тесты
        run: cargo test --all-features

      - name: Документация без предупреждений
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  cross:
    name: сборка под ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-linux-android }
          - { os: ubuntu-latest, target: armv7-linux-androideabi }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          # Целевые платформы клиента: сборка ядра под устройство и симулятор.
          - { os: macos-latest, target: aarch64-apple-ios }
          - { os: macos-latest, target: aarch64-apple-ios-sim }
    steps:
      - uses: actions/checkout@v5

      - name: Установить toolchain с целевой платформой
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: ${{ matrix.target }}

      # Часть зависимостей (blake3 с NEON-ядром, curve25519-dalek) содержит
      # код на C. Для Android нужен компилятор из NDK — cc-rs сам его не
      # находит. Тот же тулчейн потом используется для сборки .so клиента.
      - name: Настроить компилятор Android NDK
        if: contains(matrix.target, 'android')
        working-directory: .
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [ -z "$ndk" ]; then
            echo "NDK не найден на раннере" >&2
            exit 1
          fi
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"

          # Префикс clang не совпадает с триплетом Rust для 32-битного ARM.
          case "${{ matrix.target }}" in
            armv7-linux-androideabi) prefix=armv7a-linux-androideabi ;;
            *) prefix="${{ matrix.target }}" ;;
          esac

          # Берём наименьший доступный уровень API — он и будет минимально
          # поддерживаемой версией Android.
          clang=$(ls "$bin" | grep -E "^${prefix}[0-9]+-clang$" | sort -V | head -1)
          if [ -z "$clang" ]; then
            echo "не найден clang с префиксом $prefix в $bin" >&2
            ls "$bin" | head -50 >&2
            exit 1
          fi
          echo "используем $clang"

          # cc-rs читает CC_<триплет с подчёркиваниями>, cargo — CARGO_TARGET_<ТРИПЛЕТ>_LINKER.
          env_target=$(echo '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')
          {
            echo "CC_$(echo '${{ matrix.target }}' | tr '-' '_')=$bin/$clang"
            echo "AR_$(echo '${{ matrix.target }}' | tr '-' '_')=$bin/llvm-ar"
            echo "CARGO_TARGET_${env_target}_LINKER=$bin/$clang"
          } >> "$GITHUB_ENV"

      - name: Сборка
        run: cargo build --release --target ${{ matrix.target }}

  audit:
    name: аудит зависимостей
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: core
