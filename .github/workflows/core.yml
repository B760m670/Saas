# Проверка ядра.
#
# # Про стоимость — и про ошибку, которую здесь чуть не закрепили
#
# Первая редакция этого файла гоняла девять работ на каждый push **и**
# на каждый pull_request. Увидев зависшие прогоны, я решил, что дело в
# исчерпанных минутах, и убрал сборки под macOS и Windows в ручной
# запуск.
#
# Посылка была неверной. **Репозиторий публичный**, а для публичных
# репозиториев минуты Actions бесплатны и не ограничены; отчёт по
# расходу это подтверждает — `total_ms: 0` по всем раннерам. Тратить
# было нечего, и убирать сборки было незачем: именно они проверяют, что
# ядро собирается под iOS и Android, а это единственная такая проверка
# в проекте.
#
# Что из той правки уцелело и почему: **push только для main**. Ветка с
# открытым PR раньше проверялась дважды на каждый коммит — событием
# `push` и событием `pull_request`. Это не про деньги, а про то, что
# два одинаковых прогона не говорят ничего сверх одного, занимают
# очередь и удваивают шум в интерфейсе.
#
# Настоящая причина зависших прогонов осталась внешней: 6 августа около
# 18:18 UTC прогоны встали в очередь и перестали создаваться, а ручной
# запуск десятью часами позже пошёл немедленно. Это было со стороны
# GitHub, а не с нашей.

name: core

on:
  push:
    # Только основная ветка: ветки с открытым PR проверяет событие
    # ниже, и дублировать его — значит гонять два одинаковых прогона.
    branches: [main]
    paths: ["core/**", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**", ".github/workflows/core.yml"]
  workflow_dispatch:

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: core

jobs:
  check:
    name: тесты, clippy, формат
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Установить toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # Проверка правил PAC исполняет их настоящим движком JavaScript.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Формат
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Тесты
        run: cargo test --all-features

      - name: Документация без предупреждений
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  cross:
    name: сборка под ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-linux-android }
          - { os: ubuntu-latest, target: armv7-linux-androideabi }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          # Целевые платформы клиента: сборка ядра под устройство и
          # симулятор. Единственная проверка в проекте, доказывающая,
          # что ядро вообще собирается под iOS.
          - { os: macos-latest, target: aarch64-apple-ios }
          - { os: macos-latest, target: aarch64-apple-ios-sim }
    steps:
      - uses: actions/checkout@v5

      - name: Установить toolchain с целевой платформой
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: ${{ matrix.target }}

      # Часть зависимостей (blake3 с NEON-ядром, curve25519-dalek) содержит
      # код на C. Для Android нужен компилятор из NDK — cc-rs сам его не
      # находит. Тот же тулчейн потом используется для сборки .so клиента.
      - name: Настроить компилятор Android NDK
        if: contains(matrix.target, 'android')
        working-directory: .
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [ -z "$ndk" ]; then
            echo "NDK не найден на раннере" >&2
            exit 1
          fi
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"

          # Префикс clang не совпадает с триплетом Rust для 32-битного ARM.
          case "${{ matrix.target }}" in
            armv7-linux-androideabi) prefix=armv7a-linux-androideabi ;;
            *) prefix="${{ matrix.target }}" ;;
          esac

          # Берём наименьший доступный уровень API — он и будет минимально
          # поддерживаемой версией Android.
          clang=$(ls "$bin" | grep -E "^${prefix}[0-9]+-clang$" | sort -V | head -1)
          if [ -z "$clang" ]; then
            echo "не найден clang с префиксом $prefix в $bin" >&2
            ls "$bin" | head -50 >&2
            exit 1
          fi
          echo "используем $clang"

          # cc-rs читает CC_<триплет с подчёркиваниями>, cargo — CARGO_TARGET_<ТРИПЛЕТ>_LINKER.
          env_target=$(echo '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')
          {
            echo "CC_$(echo '${{ matrix.target }}' | tr '-' '_')=$bin/$clang"
            echo "AR_$(echo '${{ matrix.target }}' | tr '-' '_')=$bin/llvm-ar"
            echo "CARGO_TARGET_${env_target}_LINKER=$bin/$clang"
          } >> "$GITHUB_ENV"

      - name: Сборка
        run: cargo build --release --target ${{ matrix.target }}

  audit:
    name: аудит зависимостей
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: core
