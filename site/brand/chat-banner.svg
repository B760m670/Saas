<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1411"/>
      <stop offset="1" stop-color="#120d17"/>
    </linearGradient>
    <radialGradient id="light" gradientUnits="userSpaceOnUse" cx="1130" cy="20" r="820">
      <stop offset="0" stop-color="#ee982e" stop-opacity="0.46"/>
      <stop offset="0.42" stop-color="#ee982e" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#ee982e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember" gradientUnits="userSpaceOnUse" cx="90" cy="720" r="520">
      <stop offset="0" stop-color="#7c4dff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="butterLin" x1="0.15" y1="0.1" x2="0.9" y2="0.95">
      <stop offset="0" stop-color="#ffecbe"/>
      <stop offset="0.55" stop-color="#f5bb6c"/>
      <stop offset="1" stop-color="#ee982e"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#hero)"/>
  <rect width="1280" height="720" fill="url(#light)"/>
  <rect width="1280" height="720" fill="url(#ember)"/>

  <!-- Кольца света: общий центр за верхним правым краем, шаг растёт к краю -->
  <g fill="none" stroke="#ffecbe" stroke-width="1.5">
    <circle cx="1240" cy="-60" r="520" stroke-opacity="0.07"/>
    <circle cx="1240" cy="-60" r="820" stroke-opacity="0.055"/>
    <circle cx="1240" cy="-60" r="1180" stroke-opacity="0.04"/>
  </g>

  <!-- Знак из аватарки B, в центре кадра -->
  <g transform="translate(640 360) scale(0.56) translate(-512 -512)">
    <path d="M 731.4 436.5 A 232 232 0 1 1 587.5 292.6" fill="none" stroke="url(#butterLin)" stroke-width="70" stroke-linecap="round"/>
    <circle cx="676.0" cy="348.0" r="43.4" fill="url(#butterLin)"/>
  </g>
</svg>
