<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="70%">
      <stop offset="0" stop-color="#2a1208"/>
      <stop offset="0.45" stop-color="#140806"/>
      <stop offset="1" stop-color="#060507"/>
    </radialGradient>
    <linearGradient id="ring" x1="0.2" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset="0.35" stop-color="#ffecbe"/>
      <stop offset="1" stop-color="#ee982e"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.35" stop-color="#ffecbe"/>
      <stop offset="0.7" stop-color="#ee982e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ee982e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.55" stop-color="#ee982e" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#ee982e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ee982e" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="400" fill="url(#halo)"/>

  <!-- Буква G — незамкнутое кольцо света с перекладиной -->
  <g filter="url(#glow)" fill="none" stroke="url(#ring)" stroke-linecap="round">
    <path d="M 717 376 A 250 250 0 1 0 762 520 L 590 520" stroke-width="58"/>
  </g>

  <!-- Ядро: восход внутри G -->
  <circle cx="512" cy="512" r="120" fill="url(#core)"/>
  <circle cx="512" cy="512" r="36" fill="#fffaf0"/>
</svg>
