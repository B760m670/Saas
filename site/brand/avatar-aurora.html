<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0}

.b2{width:760px;height:700px;right:-240px;top:-260px;background:#ee982e;opacity:.6}
.b3{width:460px;height:420px;left:330px;top:560px;background:#ff6a3d;opacity:.30}

.mark{position:absolute;inset:0;filter:drop-shadow(0 0 36px rgba(255,236,190,.35))}

</body></html>
