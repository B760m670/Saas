# Описание проекта Xcode для XcodeGen.
#
# Декларативное описание вместо `.pbxproj` — сознательный выбор: этот
# файл можно прочитать, сравнить в истории и поправить. Разбор
# конфликтов слияния в `pbxproj` — занятие, которого стоит избегать.
#
# Собирается: xcodegen generate && xcodebuild …

name: Atlas
options:
  bundleIdPrefix: org.atlas
  deploymentTarget:
    # Основной способ установки — подпись своим сертификатом, а не
    # LiveContainer. Он остаётся лишь для беглого просмотра вида и
    # поведения без соединения, и его требование (iOS 15+) перестало
    # быть определяющим.
    #
    # Отсюда 16: `NavigationStack` вместо устаревшего `NavigationView`,
    # `LabeledContent` вместо самодельной строки. Цена — iPhone 6s, 7 и
    # SE первого поколения. См. docs/05-clients.md.
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  AtlasCore:
    path: AtlasCore

targets:
  Atlas:
    type: application
    platform: iOS
    sources:
      - path: AtlasApp/Sources
      - path: AtlasApp/Resources/Assets.xcassets
    info:
      path: AtlasApp/Resources/Info.plist
    dependencies:
      - package: AtlasCore
        product: AtlasCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.atlas.client
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Сборка `lite` не подписывается в CI: подпись — дело того, кто
        # ставит. LiveContainer и SideStore подписывают сами.
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        # Ядро приезжает статическим архивом под все нужные триплеты.
        #
        # `$(EFFECTIVE_PLATFORM_NAME)` в пути обязателен: он даёт
        # `-iphoneos` для устройства и `-iphonesimulator` для симулятора.
        # Архивы там разные (`aarch64-apple-ios` против
        # `aarch64-apple-ios-sim`), и без различения сборка под симулятор
        # молча подхватила бы архив устройства и упала на компоновке.
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/../../core/target/universal-ios/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-latlas_ffi"

  # Проверка в симуляторе — единственный способ отличить «собирается»
  # от «работает», не имея устройства.
  #
  # Набор намеренно **размещается в приложении** (`testHost`): тогда
  # приложение по-настоящему запускается, и падение при старте роняет
  # проверку. Отдельный набор, живущий сам по себе, этого не поймал бы.
  AtlasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AtlasTests
    # Зависимости от пакета здесь намеренно нет.
    #
    # Xcode отказывается линковать статический продукт и в приложение, и
    # в размещённый в нём набор: «This will result in duplication of
    # library code» — и он прав, набор исполняется внутри процесса
    # приложения, где код уже есть.
    #
    # Модуль `AtlasCore` виден набору иначе: приложение переэкспортирует
    # его (см. `AtlasApp/Sources/CoreReexport.swift`), поэтому
    # `@testable import Atlas` приносит и его тоже.
    dependencies:
      - target: Atlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.atlas.client.tests
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
    info:
      path: AtlasTests/Info.plist

schemes:
  Atlas:
    build:
      targets:
        Atlas: all
        AtlasTests: [test]
    test:
      targets:
        - AtlasTests
      gatherCoverageData: false
