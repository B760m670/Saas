[package]
name = "atlas-transport"
description = "Транспорты ATLAS: WebSocket и HTTP-обрамление для прохождения через CDN"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
atlas-crypto = { path = "../atlas-crypto" }
base64.workspace = true
sha1 = { version = "0.11", default-features = false }
thiserror.workspace = true

# Сквозной канал до края. Набор примитивов продиктован не вкусом, а тем,
# что вторая сторона — JavaScript внутри Cloudflare Workers: там есть
# ровно WebCrypto. Отсюда SHA-256 вместо blake3, которым пользуется
# остальной проект, и AES-GCM вместо ChaCha20-Poly1305, которого в
# WebCrypto нет вовсе.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
hkdf = { version = "0.13", default-features = false }
hmac = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
subtle.workspace = true
x25519-dalek.workspace = true

[lints]
workspace = true
