[package]
name = "atlas-tls"
description = "Клиент TLS 1.3 с отпечатком браузера: ClientHello, JA3/JA4, рукопожатие, X25519MLKEM768"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
atlas-crypto = { path = "../atlas-crypto" }
md-5 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
hkdf = { version = "0.13", default-features = false }
hmac = { version = "0.13", default-features = false }
x25519-dalek.workspace = true
ml-kem.workspace = true
subtle.workspace = true
thiserror.workspace = true
brotli-decompressor = { version = "5.0.3", default-features = false, features = ["alloc-stdlib", "std"] }

[lints]
workspace = true

[dev-dependencies]
brotli = "8.0.4"
serde_json.workspace = true
