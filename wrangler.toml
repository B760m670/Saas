# Настройки развёртывания края — в корне репозитория, и это не небрежность.
#
# Cloudflare Builds запускает `npx wrangler deploy` из корня. Наш
# `wrangler.toml` лежал только в `clients/worker/`, и сборка падала с
# «Could not detect a directory containing static files»: не найдя
# настроек, wrangler решал, что это сайт из статических файлов.
#
# Починить это можно было и в панели, полем «Root directory». Но тогда
# порядок развёртывания зависел бы от того, вспомнил ли человек
# заполнить одно поле, — а он его не вспомнит и будет прав. Файл в
# корне делает работающим порядок по умолчанию.
#
# Настройки для запуска руками из `clients/worker/` остаются там же.
#
# # Почему рядом лежит `package.json` с закреплённой версией wrangler
#
# `npx wrangler deploy` без файла зависимостей берёт последнюю версию —
# и однажды взял сломанную: `wrangler@4.121.0` объявил зависимость от
# `miniflare@5.20260804.1-alpha`, которого в реестре нет. Сборка того же
# самого, не изменившегося кода упала на установке, через сорок минут
# после успешной.
#
# Версия закреплена точно, без `^`: диапазон снова уехал бы на
# сломанную. Поднимать её теперь придётся руками — это осознанный размен
# на то, чтобы развёртывание не зависело от чужого сегодняшнего релиза.

name = "atlas-edge"
main = "clients/worker/src/worker.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Секреты задаются отдельно и в файл не попадают — он лежит в
# репозитории:
#
#   ATLAS_SECRET — 32 байта в base64url
#   ATLAS_UUID   — идентификатор пользователя
