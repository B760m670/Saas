# DNS-фильтр опции «Без рекламы». Как ставить и зачем — README.md рядом.
#
# Адрес `PUBLIC_IP` берётся из файла .env рядом (одна строка
# `PUBLIC_IP=…`): DNS слушает только внешний адрес сервера, а не все —
# на 127.0.0.53:53 уже сидит системный резолвер, и привязка ко всем
# адресам с ним бы поспорила. Кто может спрашивать, решает firewall:
# только узел VPN.
services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    restart: unless-stopped
    ports:
      - "${PUBLIC_IP}:53:53/udp"
      - "${PUBLIC_IP}:53:53/tcp"
      # Веб-настройки — только изнутри сервера, через SSH-туннель.
      - "127.0.0.1:3000:3000/tcp"
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
    # DNS-фильтру много не нужно; потолок — чтобы не мешал панели и боту.
    mem_limit: 512m
    cpus: 1.0
