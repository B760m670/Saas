# Сетевой тюнинг узла VPN. Кладётся на ХОСТЕ узла в /etc/sysctl.d/,
# не в контейнер: congestion control и очереди — ядерные, контейнер с
# network_mode: host наследует их напрямую.
#
# Зачем это, по пунктам:
#
#   BBR + fq — держит скорость на пути с переменной задержкой и редкими
#   потерями и быстро восстанавливается после потерянного пакета. На длинном
#   плече Россия↔Европа это заметно стабильнее дефолтного cubic: именно cubic
#   на каждую потерю рушит окно вдвое, отчего скорость «проваливается».
#
#   tcp_mtu_probing — если крупные пакеты молча теряются (частый случай на
#   мобильных сетях и при разном MTU по пути), ядро само нащупывает рабочий
#   размер сегмента вместо того, чтобы висеть. Это лечит симптом «мелкое
#   проходит, страницы и видео замирают» без правки MTU в приложении клиента.
#
#   slow_start_after_idle=0 — не сбрасывать окно после паузы: соединение после
#   простоя не начинает заново с черепашьей скорости.
#
#   буферы и backlog — подняты под большой BDP длинного плеча, чтобы окно было
#   куда расти и пакеты не терялись на приёме под нагрузкой.

net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_fastopen = 3

net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

net.core.netdev_max_backlog = 16384
net.core.somaxconn = 8192
